<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Project Gallery | LinkAus Networks</title>

  <meta name="description" content="Explore telecommunications rollout, field infrastructure and regional project delivery experience from LinkAus Networks." />
  <meta property="og:title" content="LinkAus Networks Projects" />
  <meta property="og:url" content="https://linkaus.com.au/projects.html" />

  <link rel="stylesheet" href="assets/style.css">

  <script async
    src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5536657592585408"
    crossorigin="anonymous"></script>
</head>

<body>

<!-- NAV BAR -->
<div style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 20px;
  background:#0f2235;
  border-bottom:2px solid #00c2ff;
  position:sticky;
  top:0;
  z-index:999;
  flex-wrap:wrap;
">

  <div style="color:#00e0ff;font-weight:bold;">
    LinkAus Networks | Field Operations
  </div>

  <div>
    <a href="index.html" style="margin:0 10px;color:#fff;text-decoration:none;">Home</a>
    <a href="projects.html" style="margin:0 10px;color:#fff;text-decoration:none;">Projects</a>
    <a href="about.html" style="margin:0 10px;color:#fff;text-decoration:none;">About</a>
    <a href="contact.html" style="margin:0 10px;color:#fff;text-decoration:none;">Contact</a>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <img src="data.jpg" class="hero-bg">
  <h1>Project Gallery</h1>
  <p>Telecommunications Infrastructure Delivery</p>
</div>

<!-- AD PLACEMENT (clean + approved positioning) -->
<div style="text-align:center; margin:20px auto;">
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="ca-pub-5536657592585408"
       data-ad-slot="9720411680"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>

  <script>
    (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>

<!-- CONTENT -->
<div class="container">

  <div style="text-align:center; margin-bottom:20px;">
    <button onclick="renderProjects()">All</button>
    <button onclick="filterProjects('fibre')">Fibre</button>
    <button onclick="filterProjects('wireless')">Wireless</button>
    <button onclick="filterProjects('civil')">Civil</button>
  </div>

  <div id="projectGrid"></div>

</div>

<!-- PROJECT DATA -->
<script>
const projects = [
  {
    title: "Regional Fibre Deployment",
    category: "fibre",
    image: "NoteGPT_Image_20260510163033.png",
    description: "Long haul fibre rollout across regional WA."
  },
  {
    title: "Wireless Tower Upgrade",
    category: "wireless",
    image: "LinkAusTower.png",
    description: "Network capacity expansion in remote zones."
  },
  {
    title: "Civil Trenching Works",
    category: "civil",
    image: "NoteGPT_Image_20260510161848.png",
    description: "Underground conduit installation and restoration."
  }
];

function renderProjects(filter = "all") {
  const grid = document.getElementById("projectGrid");
  grid.innerHTML = "";

  projects
    .filter(p => filter === "all" || p.category === filter)
    .forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.image}" style="width:100%; border-radius:6px;">
          <h3>${p.title}</h3>
          <p>${p.description}</p>
        </div>
      `;
    });
}

function filterProjects(type) {
  renderProjects(type);
}

window.onload = () => renderProjects();
</script>

</body>
</html>
